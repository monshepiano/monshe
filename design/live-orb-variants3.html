<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LIVE · кардинально разные орбы и строки — пары</title>
<link rel="stylesheet" href="../app/jarvis/web/css/app.css">
<style>
  html,body{background:#02050b;margin:0}
  body{font-family:-apple-system,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif}
  .scene{width:1440px;height:900px;position:relative;overflow:hidden;margin:0 auto 26px}
  .scene #liveRoot{position:absolute;inset:0;z-index:1}
  .badge{position:absolute;top:30px;left:34px;z-index:500;pointer-events:none;
    font-size:13px;font-weight:700;letter-spacing:3.5px;color:#5ec8ff;opacity:.95}
  .badge b{display:block;font-size:30px;letter-spacing:.2px;color:#eaf6ff;margin-top:8px}
  .badge i{display:block;font-style:normal;font-size:13px;font-weight:400;letter-spacing:.2px;
    color:#7f9bb5;margin-top:6px;max-width:560px;line-height:1.5}
  /* пара: орб сверху, строка снизу — оба в кадре */
  .pair{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:120px;z-index:3}
  .p-orb{position:relative;width:280px;height:280px}
  .p-line{position:relative;width:640px;height:64px;border-radius:40px;
    display:flex;align-items:center;padding:0 10px 0 32px}
  .p-line .ph{flex:1;font-size:18px;color:#6f8aa3;font-family:inherit}
  .p-line .send{width:46px;height:46px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;color:#55c8f0}
  .p-line .send svg{width:19px;height:19px}
  .p-line input{flex:1;min-width:0;background:transparent;border:0;outline:0;
    color:#e8f4ff;font:400 19px/1.3 -apple-system,'Segoe UI',Roboto,sans-serif}

/* ========= 01 · ТОР: кольцо света с пустым сердцем ========= */
.o01 .ring{position:absolute;inset:14%;border-radius:50%;
  background:radial-gradient(circle,transparent 58%,rgba(120,210,255,.34) 68%,rgba(80,180,255,.12) 76%,transparent 84%);
  filter:blur(2px)}
.o01 .ring2{position:absolute;inset:4%;border-radius:50%;
  background:radial-gradient(circle,transparent 66%,rgba(90,190,255,.15) 74%,transparent 84%);
  filter:blur(5px)}
.o01 .spark{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(235,250,255,.9),rgba(140,215,255,.3) 55%,transparent 75%);
  box-shadow:0 0 24px rgba(140,215,255,.5)}
.l01{border-radius:40px;background:rgba(8,18,32,.30);
  box-shadow:0 0 34px rgba(120,200,255,.15),0 0 100px rgba(90,180,255,.08)}
.l01::before{content:'';position:absolute;left:18%;right:18%;top:-14px;height:3px;border-radius:3px;
  background:linear-gradient(90deg,transparent,rgba(120,205,255,.55),transparent)}

/* ========= 02 · ЗАНАВЕС: вертикальные полотна авроры ========= */
.o02{width:360px}
.o02 .curtain{position:absolute;top:-6%;bottom:-6%;width:19%;border-radius:50% 50% 50% 50%/38% 38% 60% 60%;
  filter:blur(14px)}
.o02 .c1{left:4%;background:linear-gradient(180deg,transparent,rgba(0,225,205,.34) 42%,rgba(0,190,180,.10) 74%,transparent)}
.o02 .c2{left:29%;height:88%;top:6%;background:linear-gradient(180deg,transparent,rgba(90,160,255,.38) 46%,rgba(60,120,230,.10) 78%,transparent)}
.o02 .c3{left:54%;background:linear-gradient(180deg,transparent,rgba(140,120,255,.30) 40%,rgba(110,90,220,.08) 74%,transparent)}
.o02 .c4{left:79%;height:80%;top:12%;background:linear-gradient(180deg,transparent,rgba(0,205,255,.26) 44%,rgba(0,160,220,.08) 76%,transparent)}
.o02 .glow{position:absolute;left:50%;bottom:-2%;width:70%;height:26%;transform:translateX(-50%);
  border-radius:50%;filter:blur(16px);
  background:radial-gradient(ellipse,rgba(120,220,255,.22),transparent 70%)}
.l02{border-radius:26px;background:rgba(8,18,32,.28)}
.l02::before{content:'';position:absolute;inset:-3px;z-index:-1;border-radius:28px;
  background:linear-gradient(90deg,rgba(0,225,205,.16),rgba(90,160,255,.16) 40%,rgba(140,120,255,.16));
  filter:blur(10px)}

/* ========= 03 · ГЛАЗ: радужка и зрачок ========= */
.o03 .almond{position:absolute;inset:12% 2%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(110,200,255,.10) 58%,transparent 72%)}
.o03 .iris{position:absolute;left:50%;top:50%;width:58%;height:58%;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle at 46% 40%,rgba(160,235,255,.55),rgba(40,140,230,.34) 46%,rgba(10,60,120,.18) 72%,transparent 88%);
  box-shadow:0 0 44px rgba(90,190,255,.28)}
.o03 .pupil{position:absolute;left:50%;top:50%;width:26%;height:26%;transform:translate(-50%,-50%);
  border-radius:50% 50% 48% 48%/58% 58% 42% 42%;
  background:radial-gradient(circle at 50% 34%,rgba(235,250,255,.85),rgba(120,200,250,.25) 46%,transparent 74%);
  filter:blur(1px)}
.o03 .ray{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);
  border-radius:50%;
  background:conic-gradient(rgba(180,230,255,.12),transparent 24%,rgba(180,230,255,.10) 50%,transparent 74%,rgba(180,230,255,.12));
  filter:blur(3px)}
.l03{border-radius:50%/64%;background:rgba(8,18,32,.30);
  box-shadow:0 0 40px rgba(120,200,255,.12)}
.l03::before{content:'';position:absolute;left:10%;right:10%;top:50%;height:2px;
  background:linear-gradient(90deg,transparent,rgba(140,215,255,.5) 30%,rgba(140,215,255,.5) 70%,transparent)}

/* ========= 04 · КРИСТАЛЛ: призма с гранями ========= */
.o04 .gem{position:absolute;left:50%;top:50%;width:64%;height:64%;transform:translate(-50%,-50%);
  clip-path:polygon(50% 0,93% 32%,76% 100%,24% 100%,7% 32%);
  background:
    linear-gradient(160deg,rgba(200,240,255,.30),transparent 42%),
    linear-gradient(20deg,rgba(120,210,255,.24),transparent 46%),
    radial-gradient(circle at 50% 30%,rgba(235,250,255,.42),rgba(60,160,240,.16) 58%,transparent 82%);
  filter:drop-shadow(0 0 34px rgba(110,200,255,.30))}
.o04 .face{position:absolute;left:50%;top:50%;width:30%;height:56%;transform:translate(-50%,-46%);
  clip-path:polygon(50% 0,100% 44%,50% 100%,0 44%);
  background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 70%);
  filter:blur(2px)}
.o04 .base{position:absolute;left:24%;right:24%;bottom:2%;height:10%;border-radius:50%;
  filter:blur(9px);
  background:radial-gradient(ellipse,rgba(120,205,255,.26),transparent 70%)}
.l04{border-radius:18px;background:rgba(8,18,32,.30);
  box-shadow:0 0 30px rgba(120,200,255,.12)}
.l04::before,.l04::after{content:'';position:absolute;top:14%;bottom:14%;width:2px;
  background:linear-gradient(180deg,transparent,rgba(150,220,255,.45),transparent)}
.l04::before{left:34%}
.l04::after{right:34%}

/* ========= 05 · ВИХРЬ: спиральные рукава ========= */
.o05 .arm{position:absolute;inset:8%;border-radius:50%;filter:blur(6px)}
.o05 .a1{background:conic-gradient(from 0deg,rgba(120,210,255,.34),transparent 26%,transparent 100%)}
.o05 .a2{background:conic-gradient(from 140deg,rgba(90,190,250,.28),transparent 30%,transparent 100%)}
.o05 .a3{background:conic-gradient(from 262deg,rgba(150,220,255,.22),transparent 26%,transparent 100%)}
.o05 .core{position:absolute;inset:36%;border-radius:50%;
  background:radial-gradient(circle at 48% 44%,rgba(240,250,255,.7),rgba(130,205,255,.28) 52%,transparent 74%);
  filter:blur(1.5px);box-shadow:0 0 34px rgba(130,205,255,.34)}
.l05{border-radius:40px;background:rgba(8,18,32,.28)}
.l05 .dots{position:absolute;left:6%;right:22%;top:50%;transform:translateY(-50%);
  display:flex;justify-content:space-between;pointer-events:none}
.l05 .dots i{width:6px;height:6px;border-radius:50%;background:#9fd8ff;
  box-shadow:0 0 10px rgba(140,210,255,.8)}
.l05 .dots i:nth-child(1){width:4px;height:4px;opacity:.4}
.l05 .dots i:nth-child(2){width:4px;height:4px;opacity:.55}
.l05 .dots i:nth-child(3){width:5px;height:5px;opacity:.7}
.l05 .dots i:nth-child(5){width:5px;height:5px;opacity:.7}
.l05 .dots i:nth-child(6){width:4px;height:4px;opacity:.55}
.l05 .dots i:nth-child(7){width:4px;height:4px;opacity:.4}

/* ========= 06 · МАЯК: столб света вверх ========= */
.o06{height:320px}
.o06 .beam{position:absolute;left:36%;right:36%;top:0;bottom:12%;
  border-radius:50% 50% 40% 40%/24% 24% 12% 12%;filter:blur(10px);
  background:linear-gradient(180deg,rgba(180,235,255,.10),rgba(120,210,255,.30) 52%,rgba(90,190,255,.12) 82%,transparent)}
.o06 .crown{position:absolute;left:30%;right:30%;top:6%;height:16%;border-radius:50%;
  filter:blur(8px);
  background:radial-gradient(ellipse,rgba(230,248,255,.5),transparent 70%)}
.o06 .foot{position:absolute;left:24%;right:24%;bottom:0;height:12%;border-radius:50%;
  filter:blur(7px);
  background:radial-gradient(ellipse,rgba(120,205,255,.30),transparent 72%)}
.o06 .halo{position:absolute;left:18%;right:18%;top:24%;bottom:24%;border-radius:50%;
  background:radial-gradient(circle,transparent 56%,rgba(100,195,255,.10) 70%,transparent 82%)}
.l06{border-radius:16px;background:rgba(8,18,32,.30)}
.l06::before{content:'';position:absolute;left:10%;top:-26px;bottom:-8px;width:36%;
  background:radial-gradient(ellipse at 50% 100%,rgba(140,215,255,.20),transparent 72%);
  filter:blur(6px);border-radius:50%}

/* ========= 07 · ЖЕМЧУЖИНА: сфера на луже ========= */
.o07 .pearl{position:absolute;inset:24%;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,rgba(245,252,255,.66),rgba(160,225,255,.30) 42%,rgba(50,130,210,.16) 70%,transparent 92%);
  box-shadow:0 0 40px rgba(140,215,255,.24)}
.o07 .sheen{position:absolute;left:30%;top:28%;width:26%;height:16%;border-radius:50%;
  transform:rotate(-24deg);filter:blur(3px);
  background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 84%)}
.o07 .pool{position:absolute;left:2%;right:2%;bottom:4%;height:22%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(130,210,255,.28),rgba(80,180,255,.08) 62%,transparent 78%);
  filter:blur(4px)}
.o07 .caustic{position:absolute;left:34%;bottom:9%;width:32%;height:7%;border-radius:50%;
  filter:blur(3px);
  background:radial-gradient(ellipse,rgba(200,240,255,.4),transparent 72%)}
.l07{border-radius:50%;background:radial-gradient(ellipse at 50% 120%,rgba(0,160,255,.12),rgba(8,18,32,.34) 62%);
  box-shadow:0 22px 60px -18px rgba(110,200,255,.30)}
.l07 .send{background:rgba(120,200,255,.12)}

/* ========= 08 · ПОРТАЛ: шестиугольные грани ========= */
.o08 .hex{position:absolute;inset:10%;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);
  background:radial-gradient(circle at 50% 42%,rgba(0,232,200,.20),rgba(0,170,190,.10) 52%,transparent 78%)}
.o08 .hex2{position:absolute;inset:0;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%);
  background:radial-gradient(circle at 50% 46%,transparent 56%,rgba(0,225,205,.14) 78%,transparent 100%)}
.o08 .eye{position:absolute;inset:38%;border-radius:50%;
  background:radial-gradient(circle at 48% 44%,rgba(240,255,252,.66),rgba(0,225,205,.24) 50%,transparent 74%);
  filter:blur(1px);box-shadow:0 0 30px rgba(0,225,205,.35)}
.l08{border-radius:14px;background:rgba(6,20,26,.34);
  box-shadow:0 0 34px rgba(0,225,205,.10)}
.l08::before,.l08::after{content:'';position:absolute;top:16%;bottom:16%;width:14px;
  border:2px solid rgba(0,225,205,.4);border-left:0;border-right:0}
.l08::before{left:-22px;border-right:2px solid rgba(0,225,205,.4);border-radius:0 12px 12px 0}
.l08::after{right:-22px;border-left:2px solid rgba(0,225,205,.4);border-radius:12px 0 0 12px}

/* ========= 09 · ДУЭТ: две сферы и мост ========= */
.o09 .big{position:absolute;left:2%;top:14%;width:56%;height:56%;border-radius:50%;
  background:radial-gradient(circle at 44% 38%,rgba(215,245,255,.55),rgba(90,200,250,.26) 46%,transparent 76%);
  box-shadow:0 0 36px rgba(100,195,255,.22)}
.o09 .small{position:absolute;right:4%;top:46%;width:30%;height:30%;border-radius:50%;
  background:radial-gradient(circle at 46% 40%,rgba(255,244,222,.62),rgba(255,210,130,.24) 52%,transparent 78%);
  box-shadow:0 0 28px rgba(255,214,140,.28)}
.o09 .bridge{position:absolute;left:46%;top:47%;width:34%;height:4px;border-radius:3px;
  background:linear-gradient(90deg,rgba(120,205,255,.5),rgba(255,220,160,.5));
  filter:blur(1.6px);
  box-shadow:0 0 16px rgba(140,210,255,.4)}
.o09 .orbit{position:absolute;inset:6%;border-radius:50%;
  background:radial-gradient(circle,transparent 68%,rgba(110,200,255,.08) 80%,transparent 90%)}
.l09{border-radius:40px;background:rgba(8,18,32,.30)}
.l09 .lampL,.l09 .lampR{position:absolute;top:50%;transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%}
.l09 .lampL{left:-26px;background:radial-gradient(circle,#bfe8ff,rgba(120,200,255,.4) 60%,transparent);
  box-shadow:0 0 16px rgba(140,215,255,.8)}
.l09 .lampR{right:-26px;background:radial-gradient(circle,#ffe9c4,rgba(255,214,140,.4) 60%,transparent);
  box-shadow:0 0 16px rgba(255,214,140,.8)}

/* ========= 10 · ПЛАМЯ: живой огонь ========= */
.o10{height:300px}
.o10 .fire{position:absolute;left:26%;right:26%;top:0;bottom:10%;
  border-radius:50% 50% 46% 46%/64% 64% 34% 34%;filter:blur(3px);
  background:radial-gradient(circle at 50% 78%,rgba(255,244,214,.52),
    rgba(255,208,120,.26) 36%,rgba(255,150,70,.10) 60%,transparent 82%)}
.o10 .inner{position:absolute;left:41%;right:41%;top:24%;bottom:14%;
  border-radius:50%;filter:blur(4px);
  background:radial-gradient(circle at 50% 80%,rgba(255,255,250,.72),transparent 58%)}
.o10 .ember{position:absolute;border-radius:50%;filter:blur(1px);
  background:radial-gradient(circle,rgba(255,230,180,.85),transparent 72%)}
.o10 .e1{width:7px;height:7px;left:32%;top:22%}
.o10 .e2{width:5px;height:5px;left:62%;top:14%;opacity:.8}
.o10 .e3{width:6px;height:6px;left:50%;top:8%;opacity:.6}
.o10 .hearth{position:absolute;left:30%;right:30%;bottom:0;height:12%;border-radius:50%;
  filter:blur(8px);
  background:radial-gradient(ellipse,rgba(255,190,110,.26),transparent 70%)}
.l10{border-radius:40px;background:linear-gradient(180deg,rgba(16,24,36,.44),rgba(10,16,26,.38))}
.l10::before{content:'';position:absolute;left:12%;right:12%;bottom:12px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(255,220,160,.55) 34%,rgba(255,220,160,.55) 66%,transparent);
  box-shadow:0 0 14px rgba(255,208,140,.4)}
.l10 .spark1,.l10 .spark2{position:absolute;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,232,190,.9),transparent 72%)}
.l10 .spark1{left:18%;bottom:8px}
.l10 .spark2{right:20%;bottom:10px;opacity:.7}
</style>
</head>
<body>
<div id="host"></div>
<script>
const BAR =
  '<div class="live-bar">' +
    '<button class="lb" title="Камера"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8.4v7.2a2 2 0 0 1-2 2H4.8a2 2 0 0 1-2-2V8.4a2 2 0 0 1 2-2H13a2 2 0 0 1 2 2z"/><path d="M15 11.2l5-2.8v7.2l-5-2.8"/></svg></button>' +
    '<button class="lb on" title="Микрофон"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.6" width="6" height="11.2" rx="3"/><path d="M5.5 11.2a6.5 6.5 0 0 0 13 0"/><path d="M12 17.7V21"/><path d="M8.8 21h6.4"/></svg></button>' +
    '<button class="lb" title="Компьютер"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="4.6" width="17.2" height="12.4" rx="2.2"/><path d="M9.5 20.5h5M12 17v3.5"/></svg></button>' +
    '<button class="lb lb-exit" title="Выйти"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5H8a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h7"/><path d="M14 8.5l4 3.5-4 3.5"/><path d="M18 12H9.5"/></svg></button>' +
  '</div>';

const ORBS = {
  '01': '<i class="ring"></i><i class="ring2"></i><span class="spark"></span>',
  '02': '<i class="curtain c1"></i><i class="curtain c2"></i><i class="curtain c3"></i><i class="curtain c4"></i><i class="glow"></i>',
  '03': '<i class="almond"></i><i class="ray"></i><i class="iris"></i><i class="pupil"></i>',
  '04': '<i class="gem"></i><i class="face"></i><i class="base"></i>',
  '05': '<i class="arm a1"></i><i class="arm a2"></i><i class="arm a3"></i><i class="core"></i>',
  '06': '<i class="beam"></i><i class="crown"></i><i class="halo"></i><i class="foot"></i>',
  '07': '<i class="pool"></i><i class="pearl"></i><i class="sheen"></i><i class="caustic"></i>',
  '08': '<i class="hex"></i><i class="hex2"></i><i class="eye"></i>',
  '09': '<i class="orbit"></i><i class="big"></i><i class="bridge"></i><i class="small"></i>',
  '10': '<i class="fire"></i><i class="inner"></i><i class="ember e1"></i><i class="ember e2"></i><i class="ember e3"></i><i class="hearth"></i>',
};

const LINES = {
  '01': '', '02': '', '03': '', '04': '', '05': '<span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>',
  '06': '', '07': '', '08': '', '09': '', '10': '<span class="spark1"></span><span class="spark2"></span>',
};

const META = [
  ['01', 'Тор', 'Кольцо света с пустой сердцевиной и искрой в центре. Строка — перекладина света над вводом.'],
  ['02', 'Занавес', 'Вертикальные полотна авроры разной высоты. Строка — контейнер с градиентным ореолом.'],
  ['03', 'Глаз', 'Радужка, зрачок и лучи вокруг — Джарвис смотрит. Строка — линза-прищур с линией взгляда.'],
  ['04', 'Кристалл', 'Призма с гранями и преломлением. Строка — гранёная полоса с двумя световыми рёбрами.'],
  ['05', 'Вихрь', 'Спиральные рукава света вокруг яркого ядра. Строка — пунктир световых точек.'],
  ['06', 'Маяк', 'Столб света, расширяющийся вверх, с короной. Строка — ввод с конусом света сверху.'],
  ['07', 'Жемчужина', 'Сфера с глянцевым бликом на световой луже. Строка — лужа света с ядром-вводом.'],
  ['08', 'Портал', 'Шестиугольные грани с изумрудным глазом. Строка — две световые скобки вокруг ввода.'],
  ['09', 'Дуэт', 'Холодная и тёплая сферы, соединённые мостом света. Строка — ввод с двумя огнями по краям.'],
  ['10', 'Пламя', 'Живой огонь с искрами и углями под ним. Строка — тёплая линия с искрами.'],
];

const host = document.getElementById('host');
META.forEach(([num, name, desc]) => {
  const sc = document.createElement('div');
  sc.className = 'scene';
  sc.innerHTML =
    '<div id="liveRoot" class="open mic-on">' +
      '<div class="live-bg"><i class="la a1"></i><i class="la a2"></i><i class="la a3"></i><i class="la a4"></i><i class="la a5"></i><i class="la a6"></i><i class="la a7"></i><div class="live-sheen"></div>' +
      '<div class="live-motes"><i class="lm lm1"></i><i class="lm lm2"></i><i class="lm lm3"></i><i class="lm lm4"></i></div>' +
      '<div class="live-bubbles"><i class="bu bu1"></i><i class="bu bu2"></i><i class="bu bu3"></i><i class="bu bu4"></i><i class="bu bu5"></i><i class="bu bu6"></i></div></div>' +
      '<div class="live-veil"></div>' +
      '<div class="live-stage"><div class="live-flow">' +
        '<div class="live-dream"><div class="live-dream-in"><div class="live-q"></div><div class="live-a"></div></div></div>' +
      '</div></div>' +
      '<div class="live-voice"></div>' + BAR +
    '</div>' +
    '<div class="pair">' +
      '<div class="p-orb o' + num + '">' + ORBS[num] + '</div>' +
      '<div class="p-line l' + num + '">' + (LINES[num] || '') +
        '<span class="ph">Спроси Джарвиса…</span>' +
        '<span class="send"><svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l12 2-12 2z" fill="currentColor"/></svg></span>' +
      '</div>' +
    '</div>' +
    '<div class="badge"><span>ВАРИАНТ ' + num + '</span><b>' + name + '</b><i>' + desc + '</i></div>';
  host.appendChild(sc);
});
</script>
